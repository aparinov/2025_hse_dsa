version: '3.8'

services:
  db:
    image: postgres:14-alpine
    container_name: projects_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    # command: postgres -c "listen_addresses=*"
    env_file: .env
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: projects_web
    env_file: .env
    volumes:
      - ./src:/app/src
      - static_volume:/app/src/static_root
    expose:
      - 8000
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.23-alpine
    container_name: projects_nginx
    ports:
      - "8000:80"
    volumes:
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/static
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
